name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permissão para o GitHub criar a Release automaticamente

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Gerar ícone e tela de abertura
        run: npx capacitor-assets generate --android

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar e Renomear APK para InstaCheck
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/InstaCheck.apk

      - name: Guardar o APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: InstaCheck-apk
          path: build_output/InstaCheck.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: InstaCheck Build v1.0.${{ github.run_number }}
          body: |
            Nova versão do InstaCheck gerada automaticamente pelo GitHub Actions.
          draft: false
          prerelease: false
          files: build_output/InstaCheck.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
