name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Gerar ícone e tela de abertura
        run: npx capacitor-assets generate --android

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk InstaCheck.apk

      - name: Guardar o APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: InstaCheck-apk
          path: InstaCheck.apk

      - name: Anexar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: InstaCheck.apk
