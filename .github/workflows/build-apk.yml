name: Build e Publicar

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

# Uma execução por vez, para a numeração das versões não se repetir
concurrency:
  group: build-e-publicar
  cancel-in-progress: false

jobs:
  # 1) Descobre o próximo número de versão (continua de onde parou: v1.0.12 -> v1.0.13)
  versao:
    runs-on: ubuntu-latest
    outputs:
      numero: ${{ steps.v.outputs.numero }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular a próxima versão
        id: v
        run: |
          LAST=$(git tag -l 'v1.0.*' | sed 's/^v1\.0\.//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          NEXT=$(( ${LAST:-0} + 1 ))
          echo "numero=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Próxima versão: v1.0.${NEXT}"

  # 2) Android (APK)
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Gerar ícone e tela de abertura
        run: npx capacitor-assets generate --android

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk InstaCheck.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaCheck-apk
          path: InstaCheck.apk
          if-no-files-found: error

  # 3) Computador (Windows e Linux)
  desktop:
    needs: versao
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Compilar o app de computador
        shell: bash
        run: npx electron-builder --publish never -c.extraMetadata.version=1.0.${{ needs.versao.outputs.numero }}

      - name: Guardar os arquivos
        uses: actions/upload-artifact@v4
        with:
          name: InstaCheck-computador-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

  # 4) Cria a release com tudo junto
  publicar:
    needs: [ versao, apk, desktop ]
    # Publica o APK mesmo que a versão de computador falhe
    if: ${{ !cancelled() && needs.versao.result == 'success' && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos gerados
        uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true

      - name: Listar arquivos
        run: ls -R arquivos

      - name: Criar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ needs.versao.outputs.numero }}
          name: InstaCheck Build v1.0.${{ needs.versao.outputs.numero }}
          body: Nova versão do InstaCheck gerada automaticamente pelo GitHub Actions.
          target_commitish: ${{ github.sha }}
          files: arquivos/*
