name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Gerar ícone e tela de abertura
        run: npx capacitor-assets generate --android

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar o APK (release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Alinhar e assinar o APK com a chave fixa
        run: |
          mkdir -p build_output
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK de origem: $SRC"
          $BT/zipalign -f -p 4 "$SRC" aligned.apk
          $BT/apksigner sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build_output/InstaCheck.apk aligned.apk
          $BT/apksigner verify --verbose build_output/InstaCheck.apk

      - name: Guardar o APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: InstaCheck-apk
          path: build_output/InstaCheck.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: InstaCheck Build v1.0.${{ github.run_number }}
          body: |
            Nova versão do InstaCheck gerada automaticamente pelo GitHub Actions.
          draft: false
          prerelease: false
          files: build_output/InstaCheck.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
